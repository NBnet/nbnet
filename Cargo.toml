[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/state",
    "crates/execution",
    "crates/rpc",
    "crates/txpool",
    "crates/precompile",
    "crates/node",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/rust-util-collections/nbnet"
keywords = ["evm", "ethereum", "consensus", "hotstuff2", "bft"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ruc = "11.0.3"
postcard = { version = "1.1.3", features = ["alloc"] }
blake3 = "1.8.7"
ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core", "batch"] }
rand = "0.10.4"
vsdb = "17.0.19"
revm = { version = "43.0.3", default-features = false, features = ["std"] }
alloy-primitives = { version = "1.7.3", features = ["serde"] }
alloy-rlp = "0.3.17"
alloy-consensus = { version = "2.5.0", default-features = false, features = ["std", "k256"] }
alloy-eips = { version = "2.5.0", default-features = false, features = ["std", "k256"] }
alloy-signer = "2.5.0"
alloy-signer-local = "2.5.0"
alloy-network = "2.5.0"
k256 = { version = "0.14.0", features = ["ecdsa"] }
litep2p = "0.17.0"
async-trait = "0.1.92"
futures = "0.3.34"
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1"
dirs = "7.0.0"
hex = "0.4.3"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }
parking_lot = "0.13.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

# Latest hotmint crates published on crates.io.
hotmint = "0.8.14"
hotmint-types = "0.8.14"
hotmint-crypto = "0.8.14"
hotmint-consensus = "0.8.14"
hotmint-mempool = "0.8.14"
hotmint-mgmt = "0.8.14"

# nbnet crates
nbnet-types = { path = "crates/types" }
nbnet-state = { path = "crates/state" }
nbnet-execution = { path = "crates/execution" }
nbnet-rpc = { path = "crates/rpc" }
nbnet-txpool = { path = "crates/txpool" }
nbnet-precompile = { path = "crates/precompile" }
nbnet-node = { path = "crates/node" }
